<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-nt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9d4b6"/>
      <stop offset="55%" stop-color="#c89146"/>
      <stop offset="100%" stop-color="#5a3a1a"/>
    </linearGradient>
    <radialGradient id="glow-nt" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fbf3e2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fbf3e2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg-nt)"/>
  <ellipse cx="600" cy="400" rx="500" ry="380" fill="url(#glow-nt)"/>

  <!-- Calendar grid 7×5 -->
  <g transform="translate(300 170)">
    <!-- Header day-of-week -->
    <g font-family="Cormorant Garamond, serif" font-size="20" fill="#5a3a1a" text-anchor="middle" opacity="0.8" font-style="italic">
      <text x="40" y="0">T2</text>
      <text x="130" y="0">T3</text>
      <text x="220" y="0">T4</text>
      <text x="310" y="0">T5</text>
      <text x="400" y="0">T6</text>
      <text x="490" y="0">T7</text>
      <text x="580" y="0">CN</text>
    </g>

    <!-- Grid cells -->
    <g stroke="#5a3a1a" stroke-opacity="0.4" stroke-width="1" fill="#fbf3e2" fill-opacity="0.55">
      <!-- Row 1 -->
      <rect x="0" y="20" width="80" height="80" rx="6"/>
      <rect x="90" y="20" width="80" height="80" rx="6"/>
      <rect x="180" y="20" width="80" height="80" rx="6"/>
      <rect x="270" y="20" width="80" height="80" rx="6"/>
      <rect x="360" y="20" width="80" height="80" rx="6"/>
      <rect x="450" y="20" width="80" height="80" rx="6"/>
      <rect x="540" y="20" width="80" height="80" rx="6"/>
      <!-- Row 2 -->
      <rect x="0" y="110" width="80" height="80" rx="6"/>
      <rect x="90" y="110" width="80" height="80" rx="6"/>
      <rect x="180" y="110" width="80" height="80" rx="6"/>
      <rect x="270" y="110" width="80" height="80" rx="6"/>
      <rect x="360" y="110" width="80" height="80" rx="6"/>
      <rect x="450" y="110" width="80" height="80" rx="6"/>
      <rect x="540" y="110" width="80" height="80" rx="6"/>
      <!-- Row 3 -->
      <rect x="0" y="200" width="80" height="80" rx="6"/>
      <rect x="90" y="200" width="80" height="80" rx="6"/>
      <rect x="180" y="200" width="80" height="80" rx="6"/>
      <rect x="270" y="200" width="80" height="80" rx="6"/>
      <rect x="360" y="200" width="80" height="80" rx="6"/>
      <rect x="450" y="200" width="80" height="80" rx="6"/>
      <rect x="540" y="200" width="80" height="80" rx="6"/>
      <!-- Row 4 -->
      <rect x="0" y="290" width="80" height="80" rx="6"/>
      <rect x="90" y="290" width="80" height="80" rx="6"/>
      <rect x="180" y="290" width="80" height="80" rx="6"/>
      <rect x="270" y="290" width="80" height="80" rx="6"/>
      <rect x="360" y="290" width="80" height="80" rx="6"/>
      <rect x="450" y="290" width="80" height="80" rx="6"/>
      <rect x="540" y="290" width="80" height="80" rx="6"/>
    </g>

    <!-- Highlight auspicious days with stars -->
    <g fill="#c8361d">
      <polygon points="220,60 226,76 244,76 230,86 235,103 220,93 205,103 210,86 196,76 214,76" opacity="0.85"/>
      <polygon points="400,150 406,166 424,166 410,176 415,193 400,183 385,193 390,176 376,166 394,166" opacity="0.85"/>
      <polygon points="130,240 136,256 154,256 140,266 145,283 130,273 115,283 120,266 106,256 124,256" opacity="0.85"/>
      <polygon points="490,330 496,346 514,346 500,356 505,373 490,363 475,373 480,356 466,346 484,346" opacity="0.85"/>
    </g>

    <!-- Day numbers (sample) -->
    <g font-family="Cormorant Garamond, serif" font-size="22" fill="#5a3a1a" text-anchor="middle" font-style="italic">
      <text x="40" y="65">1</text>
      <text x="310" y="65">4</text>
      <text x="490" y="65">6</text>
      <text x="130" y="155">9</text>
      <text x="400" y="155">12</text>
      <text x="220" y="245">17</text>
      <text x="40" y="335">22</text>
      <text x="490" y="335">26</text>
    </g>
  </g>

  <!-- 吉 character lower right -->
  <g transform="translate(940 600)">
    <circle r="80" fill="#5a3a1a" opacity="0.85"/>
    <circle r="68" fill="none" stroke="#fbf3e2" stroke-width="1.5"/>
    <text text-anchor="middle" dy="0.32em" font-family="Cormorant Garamond, serif" font-size="92" fill="#fbf3e2" font-weight="bold">吉</text>
  </g>

  <!-- Title -->
  <text x="600" y="120" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="36" fill="#5a3a1a" font-style="italic">Lịch Vạn Niên</text>
</svg>
